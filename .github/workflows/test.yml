name: Tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify-actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -v -race ./...
  mod:
    name: Check that `go mod tidy` is clean
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Check
        run: go mod tidy -diff
